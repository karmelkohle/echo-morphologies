name: Build and deploy

# Two jobs in one workflow because they answer different questions.
#
# `build` is real CI — it typechecks and bundles both the app and the audio
# worklet, and it must go red when either breaks.
#
# `deploy` publishes to Pages, which the app needs because getUserMedia is
# blocked on plain http and none of this can be tried on a phone without an
# https origin. Publishing depends on a setting no workflow can flip for
# itself: *Settings → Pages → Source: GitHub Actions*, one time, by a human.
# (The API call to create a Pages site is refused to the workflow token, and
# a private repository additionally needs a plan that allows Pages.)
#
# So the Pages steps are allowed to fail without taking CI down with them. Until
# the setting is on, the build stays green and the deploy is skipped with a
# note; the moment it is on, the next push publishes.

on:
  push:
    branches:
      - main
      - claude/audio-pwa-granular-framework-gpbn7c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The smoke test's browser is a local tool; a deploy has no use for
          # 150 MB of Chromium.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build
        run: npm run build
        env:
          # Pages serves the site from /<repo>/, so the bundle's asset URLs and
          # the worklet path have to be prefixed to match.
          PAGES_BASE: /${{ github.event.repository.name }}/

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=Pages not enabled::The build succeeded and the deploy was skipped. \
          Turn Pages on under Settings → Pages → Source: GitHub Actions, then re-run this workflow."

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
