name: Mirror to a second repository

# Keeps a copy of this repository in another account in step with this one, so
# work done here shows up there without copying files by hand.
#
# Inert until two settings exist, under
# Settings → Secrets and variables → Actions:
#
#   Variable  MIRROR_REPO    owner/name of the target,
#                            e.g. someone-else/echo-morphologies
#   Secret    MIRROR_TOKEN   a fine-grained personal access token issued by the
#                            account that owns the target, scoped to that one
#                            repository, with two permissions:
#                              Contents:  Read and write
#                              Workflows: Read and write
#
# Both are needed. Contents alone looks sufficient and is not: this repository
# carries files under .github/workflows/, and GitHub refuses any token-authored
# push that creates or changes a workflow file unless the token also carries
# Workflows. The failure is at push time and names the offending file.
#
# The mirror is downstream, not a second place to work. The push is forced, so
# any commit that exists only over there is overwritten on the next push here.
# It has to be forced: a repository that was populated by copying files in has a
# history unrelated to this one, and no fast-forward can join the two. Commit
# here, test there.
#
# Do not set these two values on the mirror itself, or the pair will push at
# each other.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    # Skips silently on any repository that has not been told where to push,
    # which includes the mirror itself.
    if: vars.MIRROR_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The target needs the whole history, not the single commit a default
          # checkout fetches.
          fetch-depth: 0

      - name: Check the token is present
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error title=Mirror not configured::MIRROR_REPO is set to \
            '$MIRROR_REPO' but the MIRROR_TOKEN secret is missing. Add a \
            fine-grained token with Contents: Read and write on that repository."
            exit 1
          fi

      # The push is performed by whoever owns the token, and that account is what
      # the target's history records — not this repository's owner. Printing the
      # login makes that checkable rather than assumed: if this names the source
      # account, the wrong token is installed.
      - name: Identify the pushing account
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          login=$(curl -fsS -H "Authorization: Bearer $MIRROR_TOKEN" \
            https://api.github.com/user 2>/dev/null | jq -r '.login // empty') || true
          if [ -n "$login" ]; then
            echo "::notice title=Pushing as::$login"
          else
            # Some fine-grained tokens cannot read /user. Not a problem — it
            # only means this check cannot confirm what the push already does.
            echo "::notice title=Pushing as::the token's account could not be read; \
            the push still runs as whoever owns the token"
          fi

      - name: Push to ${{ vars.MIRROR_REPO }}
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # The URL is passed straight to `git push` rather than registered with
          # `git remote add`, so the token never lands in .git/config. Actions
          # masks the value itself in the log.
          git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"

          echo "::notice title=Mirrored::${GITHUB_REF_NAME} → ${MIRROR_REPO}"
