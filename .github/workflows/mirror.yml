name: Mirror to a second repository

# Keeps a copy of this repository in another account in step with this one, so
# work done here shows up there without copying files by hand.
#
# Configuration lives on THIS repository (the source), under
# Settings → Secrets and variables → Actions. That page has two tabs, and one
# value goes in each — the tab matters, they are not interchangeable:
#
#   VARIABLES tab   MIRROR_REPO    owner/name of the target repository
#   SECRETS tab     MIRROR_TOKEN   a fine-grained personal access token issued
#                                  by the account that owns the target, scoped
#                                  to that one repository, with two permissions:
#                                    Contents:  Read and write
#                                    Workflows: Read and write
#
# Both permissions are needed: this repository carries files under
# .github/workflows/, and GitHub refuses a token-authored push that creates or
# changes a workflow file unless the token also carries Workflows.
#
# Large files tracked by Git LFS are mirrored too — the LFS objects are pushed
# to the target's LFS storage before the commits, so the target never holds
# pointers to objects it does not have. Each run re-downloads the LFS objects
# from this repository's LFS storage, which counts against its LFS bandwidth
# quota; if that ever bites, the fix is a cache step, or storing files under
# GitHub's 100 MB blob limit as plain git objects instead.
#
# The mirror is downstream, not a second place to work. The push is forced, so
# any commit that exists only over there is overwritten on the next push here.
# It has to be forced: a repository that was populated by copying files in has a
# history unrelated to this one, and no fast-forward can join the two. Commit
# here, test there.
#
# On the target repository this workflow also exists (it gets mirrored like
# everything else) and runs unconfigured — it says so and stops. Ignore it
# there, and do not configure it there, or the pair will push at each other.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # Misconfiguration used to skip the whole job silently, which reads as
      # "the mirror is broken and says nothing". Now every state says what it
      # is: missing entirely, in the wrong tab, or missing its token.
      - name: Check configuration
        id: config
        env:
          HAS_VAR: ${{ vars.MIRROR_REPO != '' }}
          VAR_IN_SECRETS_TAB: ${{ secrets.MIRROR_REPO != '' }}
          HAS_TOKEN: ${{ secrets.MIRROR_TOKEN != '' }}
        run: |
          if [ "$HAS_VAR" != "true" ]; then
            if [ "$VAR_IN_SECRETS_TAB" = "true" ]; then
              echo "::error title=MIRROR_REPO is in the wrong tab::MIRROR_REPO \
          exists as a SECRET on ${{ github.repository }}, but this workflow reads \
          it as a VARIABLE — the two tabs are separate stores. Delete the secret \
          and re-create it under Settings → Secrets and variables → Actions → \
          Variables tab."
              exit 1
            fi
            echo "::warning title=Mirror not configured::No MIRROR_REPO variable \
          exists on ${{ github.repository }}, so nothing was pushed. To turn the \
          mirror on, add it under Settings → Secrets and variables → Actions → \
          Variables tab. If this repository IS the mirror target, this message is \
          expected — ignore it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=MIRROR_TOKEN is missing::MIRROR_REPO is set to \
          '${{ vars.MIRROR_REPO }}' but there is no MIRROR_TOKEN secret on \
          ${{ github.repository }}. Add one under Settings → Secrets and \
          variables → Actions → Secrets tab: a fine-grained token issued by the \
          target's account, scoped to that repository, with Contents and \
          Workflows both Read and write."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          # The target needs the whole history, not the single commit a default
          # checkout fetches; lfs pulls the real large-file objects so they can
          # be forwarded, not just the pointers that stand in for them.
          fetch-depth: 0
          lfs: true

      # The push is performed by whoever owns the token, and that account is
      # what the target's history records — not this repository's owner.
      # Printing the login makes that checkable rather than assumed: if this
      # names the source account, the wrong token is installed.
      - name: Identify the pushing account
        if: steps.config.outputs.configured == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          login=$(curl -fsS -H "Authorization: Bearer $MIRROR_TOKEN" \
            https://api.github.com/user 2>/dev/null | jq -r '.login // empty') || true
          if [ -n "$login" ]; then
            echo "::notice title=Pushing as::$login"
          else
            # Some fine-grained tokens cannot read /user. Not a problem — it
            # only means this check cannot confirm what the push already does.
            echo "::notice title=Pushing as::the token's account could not be read; \
            the push still runs as whoever owns the token"
          fi

      # The target may be public and belongs to a different account than the
      # source, so no commit may carry any identity beyond the two allowed
      # ones. Normally the history is already clean; this rewrites any commit
      # that slipped through (a laptop with an unconfigured user.email) to the
      # target's account before it ever reaches the target. Deterministic, so
      # repeated runs produce identical SHAs on the mirror.
      - name: Normalize commit identities
        if: steps.config.outputs.configured == 'true'
        run: |
          if git log --format='%ae%n%ce' | sort -u | grep -qvE \
            '^(noreply@anthropic\.com|karmelkohle@users\.noreply\.github\.com)$'; then
            echo "::warning title=Identity scrubbed::A commit carried a foreign \
          author or committer; rewritten to the mirror account before pushing."
            FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
              case "$GIT_AUTHOR_EMAIL" in
                noreply@anthropic.com|karmelkohle@users.noreply.github.com) ;;
                *) export GIT_AUTHOR_NAME="karmelkohle"
                   export GIT_AUTHOR_EMAIL="karmelkohle@users.noreply.github.com" ;;
              esac
              case "$GIT_COMMITTER_EMAIL" in
                noreply@anthropic.com|karmelkohle@users.noreply.github.com) ;;
                *) export GIT_COMMITTER_NAME="karmelkohle"
                   export GIT_COMMITTER_EMAIL="karmelkohle@users.noreply.github.com" ;;
              esac
            ' HEAD
          fi

      - name: Push to ${{ vars.MIRROR_REPO }}
        if: steps.config.outputs.configured == 'true'
        env:
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # Every LFS object in history has to be local before it can be
          # forwarded. The checkout only fetched the current ref's objects;
          # this pulls the rest, and it must happen first because it needs the
          # source credentials that are about to be removed.
          git lfs fetch --all origin

          # actions/checkout wires this repository's own token into every
          # github.com request as an extra header. Requests to the mirror then
          # carry two identities — the URL's token and this header's — and
          # GitHub's LFS API refuses the pair ("must have push access to verify
          # locks" on a token that plainly has it). Origin is not needed from
          # here on, so drop the header.
          git config --unset-all "http.https://github.com/.extraheader" || true

          # A named remote rather than a bare URL because git-lfs needs one it
          # can resolve credentials against. The token only ever exists in the
          # config of this ephemeral runner, and Actions masks it in the log.
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"

          # LFS file locking is not used in this project, and the lock-verify
          # round-trip is the one LFS call token auth most often stumbles on.
          # Off means "push without asking about locks", nothing more.
          git config "lfs.https://github.com/${MIRROR_REPO}.git/info/lfs.locksverify" false

          # Objects before refs: once the commits land, their pointers must
          # already resolve, or a checkout on the target — including its own
          # Pages build, which starts immediately — would see broken files.
          # Objects the target already has are skipped, so this is cheap after
          # the first run.
          git lfs push --all mirror

          git push --force mirror "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git remote remove mirror

          echo "::notice title=Mirrored::${GITHUB_REF_NAME} → ${MIRROR_REPO}"
